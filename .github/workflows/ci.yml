name: Public release CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reviewed-file and private-provider guard
        run: |
          python scripts/test_public_guard.py
          python scripts/public_leakage_guard.py
      - name: Install verified pinned secret scanner
        run: |
          curl --fail --location --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan complete public history
        run: /tmp/gitleaks git --redact --no-banner --log-opts='--all' .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: spikelens
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: spikelens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U spikelens -d spikelens_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql+psycopg://spikelens:ci-test-only@127.0.0.1:5432/spikelens_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/2
      UPLOAD_DIR: /tmp/spikelens-tests/uploads
      JOB_LEASE_SECONDS: '10'
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: backend
        run: python -m pip install -r requirements.lock
      - name: Ruff and actual PostgreSQL/Redis integration
        working-directory: backend
        run: |
          ruff check app tests alembic
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked install, types, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

  docker-e2e:
    runs-on: ubuntu-latest
    needs: public-safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fresh demo environment
        run: python scripts/init_env.py
      - name: Actual public images and migrations
        run: |
          docker compose config --quiet
          docker compose build backend frontend
          docker compose up -d --wait --wait-timeout 240
          docker compose exec -T backend python -m app.db.seed --count 10000
          curl --fail http://127.0.0.1:8200/api/v1/health/ready
      - name: Real browser to API to worker flow
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3200
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Disposable CI services cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
