[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[project]
name = "spikelens-backend"
version = "0.1.0"
description = "Public synthetic event processing demo; private prediction implementations excluded"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "celery[redis]>=5.4,<6",
  "argon2-cffi>=23.1,<26", "python-multipart>=0.0.18,<1", "email-validator>=2.2,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and Redis"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.setuptools.package-data]
"app.providers" = ["fixtures.json"]
